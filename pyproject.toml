[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "pydantic>=2.13.4",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
]

[tool.mypy]
exclude = "^llm_sdk/"

[[tool.mypy.overrides]]
module = "llm_sdk"
ignore_errors = true
